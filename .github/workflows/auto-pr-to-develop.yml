name: Auto PR to Develop

# Workflow será acionado após push em branches feature/*
on:
  push:
    branches:
      - 'feature/*'

# Permissões necessárias para criar Pull Requests
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  wait-for-ci:
    name: Wait for CI/CD Success
    runs-on: ubuntu-latest
    
    steps:
      # Checkout do código
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Aguardar o sucesso do workflow de CI/CD
      - name: Wait for CI/CD Workflow
        id: wait_ci
        run: |
          echo "🔍 Aguardando conclusão do workflow de CI/CD..."
          
          # Aguardar até 10 minutos pelo workflow
          for i in {1..60}; do
            # Buscar workflows em execução para este commit
            WORKFLOWS=$(gh api \
              "repos/${{ github.repository }}/actions/runs" \
              --jq ".workflow_runs[] | select(.head_sha == \"${{ github.sha }}\" and .name == \"Feature Branch CI/CD\")")
            
            if [ -n "$WORKFLOWS" ]; then
              STATUS=$(echo "$WORKFLOWS" | jq -r '.conclusion // .status')
              
              if [ "$STATUS" = "success" ]; then
                echo "✅ CI/CD concluído com sucesso!"
                echo "ci_success=true" >> $GITHUB_OUTPUT
                break
              elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
                echo "❌ CI/CD falhou ou foi cancelado: $STATUS"
                echo "ci_success=false" >> $GITHUB_OUTPUT
                break
              else
                echo "⏳ CI/CD ainda em execução... (tentativa $i/60)"
                sleep 10
              fi
            else
              echo "⏳ Aguardando início do workflow... (tentativa $i/60)"
              sleep 10
            fi
          done
          
          # Se chegou até aqui sem sucesso, timeout
          if [ -z "$(echo $GITHUB_OUTPUT | grep ci_success)" ]; then
            echo "⏰ Timeout aguardando CI/CD"
            echo "ci_success=timeout" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    outputs:
      ci_success: ${{ steps.wait_ci.outputs.ci_success }}

  create-pull-request:
    name: Create PR to Develop
    runs-on: ubuntu-latest
    needs: wait-for-ci
    
    # Só executa se o CI/CD foi bem-sucedido
    if: needs.wait-for-ci.outputs.ci_success == 'true'
    
    steps:
      # Checkout do código
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      # Obter informações da branch
      - name: Get Branch Info
        id: branch_info
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "pr_title=feat: Auto PR from $BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "pr_body=🤖 **Automated Pull Request**
          
          Esta PR foi criada automaticamente após o sucesso do workflow de CI/CD.
          
          **Branch de origem:** \`$BRANCH_NAME\`
          **Branch de destino:** \`develop\`
          
          ### ✅ Validações Executadas com Sucesso:
          - ✅ Testes passaram
          - ✅ Build executado com sucesso
          - ✅ Aplicação inicializa corretamente
          
          ### 📋 Próximos Passos:
          1. Revisar as mudanças
          2. Testar se necessário
          3. Aprovar e fazer merge
          
          **Commit:** \`${{ github.sha }}\`
          **Author:** ${{ github.actor }}
          " >> $GITHUB_OUTPUT
      
      # Verificar se a branch develop existe
      - name: Check if develop branch exists
        id: check_develop
        run: |
          if git ls-remote --heads origin develop | grep -q "refs/heads/develop"; then
            echo "develop_exists=true" >> $GITHUB_OUTPUT
          else
            echo "develop_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Branch 'develop' não encontrada. Criando branch develop a partir de main..."
          fi
      
      # Criar branch develop se não existir
      - name: Create develop branch if needed
        if: steps.check_develop.outputs.develop_exists == 'false'
        run: |
          git checkout -b develop
          git push origin develop
      
      # Verificar se PR já existe
      - name: Check if PR already exists
        id: check_pr
        run: |
          EXISTING_PR=$(gh pr list --head "${{ steps.branch_info.outputs.branch_name }}" --base develop --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "ℹ️ PR já existe: #$EXISTING_PR"
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Nenhuma PR existente encontrada"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Criar Pull Request se não existir
      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_exists == 'false'
        id: create_pr
        run: |
          PR_URL=$(gh pr create \
            --title "${{ steps.branch_info.outputs.pr_title }}" \
            --body "${{ steps.branch_info.outputs.pr_body }}" \
            --base develop \
            --head "${{ steps.branch_info.outputs.branch_name }}")
          
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "🎉 Pull Request criada: $PR_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Comentário de sucesso
      - name: Success Notification
        if: steps.check_pr.outputs.pr_exists == 'false'
        run: |
          echo "🎉 **Pull Request criada com sucesso!**"
          echo "📋 **Detalhes:**"
          echo "   - Branch: ${{ steps.branch_info.outputs.branch_name }}"
          echo "   - Destino: develop"
          echo "   - URL: ${{ steps.create_pr.outputs.pr_url }}"
          echo ""
          echo "✅ Workflow de automação concluído!"
      
      # Notificação se PR já existe
      - name: PR Already Exists Notification
        if: steps.check_pr.outputs.pr_exists == 'true'
        run: |
          echo "ℹ️ **Pull Request já existe**"
          echo "📋 **Detalhes:**"
          echo "   - Branch: ${{ steps.branch_info.outputs.branch_name }}"
          echo "   - PR existente: #${{ steps.check_pr.outputs.pr_number }}"
          echo "   - Destino: develop"
          echo ""
          echo "✅ Nenhuma ação necessária!"
  
  # Job para tratar falhas no workflow de CI/CD
  handle-failure:
    name: Handle CI/CD Failure
    runs-on: ubuntu-latest
    needs: wait-for-ci
    
    # Só executa se o CI/CD falhou
    if: needs.wait-for-ci.outputs.ci_success == 'false'
    
    steps:
      - name: CI/CD Failed Notification
        run: |
          echo "❌ **CI/CD Workflow Failed**"
          echo "🔍 **Detalhes:**"
          echo "   - Branch: ${{ github.ref_name }}"
          echo "   - Commit: ${{ github.sha }}"
          echo "   - Author: ${{ github.actor }}"
          echo ""
          echo "🛠️ **Ação necessária:**"
          echo "   1. Verificar os logs do workflow que falhou"
          echo "   2. Corrigir os problemas identificados"
          echo "   3. Fazer push novamente para executar o CI/CD"
          echo ""
          echo "❌ Pull Request NÃO será criada até que todos os testes passem."
  
  # Job para tratar timeout
  handle-timeout:
    name: Handle CI/CD Timeout
    runs-on: ubuntu-latest
    needs: wait-for-ci
    
    # Só executa se houve timeout
    if: needs.wait-for-ci.outputs.ci_success == 'timeout'
    
    steps:
      - name: CI/CD Timeout Notification
        run: |
          echo "⏰ **CI/CD Workflow Timeout**"
          echo "🔍 **Detalhes:**"
          echo "   - Branch: ${{ github.ref_name }}"
          echo "   - Timeout após 10 minutos"
          echo ""
          echo "🛠️ **Possíveis causas:**"
          echo "   1. Workflow de CI/CD muito lento"
          echo "   2. Workflow não foi iniciado"
          echo "   3. Problemas na infraestrutura do GitHub"
          echo ""
          echo "🔄 **Recomendação:** Verificar manualmente o status dos workflows"
