name: Create Pull Request to Develop

# Workflow reutilizável que pode ser chamado por outros workflows
on:
  workflow_call:
    inputs:
      source_branch:
        description: 'Branch de origem para o PR'
        required: true
        type: string
      pr_title:
        description: 'Título do Pull Request'
        required: false
        type: string
        default: 'feat: Auto PR from feature branch'

# Permissões necessárias para criar Pull Requests
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  create-pull-request:
    name: Create PR to Develop
    runs-on: ubuntu-latest
    
    steps:
      # Checkout do código
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      # Obter informações da branch
      - name: Get Branch Info
        id: branch_info
        run: |
          BRANCH_NAME="${{ inputs.source_branch }}"
          COMMIT_SHA="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          
          # Criar título personalizado se não fornecido
          if [ -z "${{ inputs.pr_title }}" ]; then
            PR_TITLE="feat: Auto PR from $BRANCH_NAME"
          else
            PR_TITLE="${{ inputs.pr_title }}"
          fi
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
      
      # Criar arquivo temporário com o corpo do PR
      - name: Create PR Body
        run: |
          cat > pr_body.md << 'EOF'
          🤖 **Automated Pull Request**
          
          Esta PR foi criada automaticamente após o sucesso do workflow de CI/CD.
          
          **Branch de origem:** `${{ steps.branch_info.outputs.branch_name }}`
          **Branch de destino:** `develop`
          **Commit:** `${{ steps.branch_info.outputs.commit_sha }}`
          **Author:** ${{ steps.branch_info.outputs.author }}
          
          ### ✅ Validações Executadas com Sucesso:
          - ✅ Setup do Node.js 20 concluído
          - ✅ Dependências instaladas com sucesso
          - ✅ Testes executados e aprovados
          - ✅ Build executado com sucesso
          - ✅ Aplicação inicializa corretamente
          
          ### 📋 Próximos Passos:
          1. 👀 Revisar as mudanças no código
          2. 🧪 Testar localmente se necessário
          3. ✅ Aprovar e fazer merge para develop
          
          ---
          *Este PR foi criado automaticamente pelo workflow de CI/CD*
          EOF
      
      # Verificar se a branch develop existe
      - name: Check if develop branch exists
        id: check_develop
        run: |
          if git ls-remote --heads origin develop | grep -q "refs/heads/develop"; then
            echo "develop_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Branch 'develop' encontrada"
          else
            echo "develop_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Branch 'develop' não encontrada. Será criada a partir da branch main."
          fi
      
      # Criar branch develop se não existir
      - name: Create develop branch if needed
        if: steps.check_develop.outputs.develop_exists == 'false'
        run: |
          echo "🔧 Criando branch develop..."
          
          # Configurar git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch todas as branches
          git fetch origin
          
          # Verificar se main existe, senão usar master
          if git ls-remote --heads origin main | grep -q "refs/heads/main"; then
            BASE_BRANCH="main"
          else
            BASE_BRANCH="master"
          fi
          
          echo "📋 Usando branch base: $BASE_BRANCH"
          
          # Criar e fazer push da branch develop
          git checkout -b develop origin/$BASE_BRANCH
          git push origin develop
          
          echo "✅ Branch develop criada com sucesso a partir de $BASE_BRANCH!"
      
      # Verificar se PR já existe
      - name: Check if PR already exists
        id: check_pr
        run: |
          echo "🔍 Verificando se PR já existe..."
          EXISTING_PR=$(gh pr list \
            --head "${{ steps.branch_info.outputs.branch_name }}" \
            --base develop \
            --json number,url \
            --jq '.[0] // empty' || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "ℹ️ PR já existe: #$PR_NUMBER ($PR_URL)"
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Nenhuma PR existente encontrada"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Instruções para criar PR manualmente (devido à política do repositório)
      - name: PR Creation Instructions
        if: steps.check_pr.outputs.pr_exists == 'false'
        run: |
          echo "🤖 **Automação de Pull Request**"
          echo ""
          echo "✅ **CI/CD executado com sucesso!** Todos os testes passaram."
          echo ""
          echo "⚠️ **Nota:** Este repositório tem políticas de segurança que impedem"
          echo "o GitHub Actions de criar Pull Requests automaticamente."
          echo ""
          echo "📋 **Para criar o PR manualmente, execute:**"
          echo ""
          echo "1. **Via GitHub CLI (gh):**"
          echo "   \`\`\`bash"
          echo "   gh pr create \\"
          echo "     --title '${{ steps.branch_info.outputs.pr_title }}' \\"
          echo "     --body-file pr_body.md \\"
          echo "     --base develop \\"
          echo "     --head ${{ steps.branch_info.outputs.branch_name }}"
          echo "   \`\`\`"
          echo ""
          echo "2. **Via interface web do GitHub:**"
          echo "   - Acesse: https://github.com/${{ github.repository }}/compare/develop...${{ steps.branch_info.outputs.branch_name }}"
          echo "   - Clique em 'Create pull request'"
          echo "   - Use o título: '${{ steps.branch_info.outputs.pr_title }}'"
          echo ""
          echo "📝 **Detalhes do PR:**"
          echo "   - 🌿 Branch origem: ${{ steps.branch_info.outputs.branch_name }}"
          echo "   - 🎯 Branch destino: develop"
          echo "   - 👤 Author: ${{ steps.branch_info.outputs.author }}"
          echo "   - 🔗 Commit: ${{ steps.branch_info.outputs.commit_sha }}"
          echo ""
          echo "✅ **Validações realizadas com sucesso:**"
          echo "   - ✅ Setup do Node.js 20 concluído"
          echo "   - ✅ Dependências instaladas"
          echo "   - ✅ Testes executados e aprovados"
          echo "   - ✅ Build executado com sucesso"
          echo "   - ✅ Aplicação inicializa corretamente"
      
      # Criar arquivo com instruções detalhadas
      - name: Create PR Instructions File
        if: steps.check_pr.outputs.pr_exists == 'false'
        run: |
          cat > PR_INSTRUCTIONS.md << 'EOF'
          # 🤖 Instruções para Criar Pull Request
          
          ## ✅ CI/CD Executado com Sucesso!
          
          Todos os testes passaram e a branch está pronta para merge.
          
          ## 📋 Detalhes da Branch
          
          - **Branch origem:** `${{ steps.branch_info.outputs.branch_name }}`
          - **Branch destino:** `develop`
          - **Author:** ${{ steps.branch_info.outputs.author }}
          - **Commit:** `${{ steps.branch_info.outputs.commit_sha }}`
          
          ## 🚀 Como Criar o Pull Request
          
          ### Opção 1: GitHub CLI
          ```bash
          gh pr create \
            --title "${{ steps.branch_info.outputs.pr_title }}" \
            --body-file pr_body.md \
            --base develop \
            --head ${{ steps.branch_info.outputs.branch_name }}
          ```
          
          ### Opção 2: Interface Web
          [Clique aqui para criar o PR](https://github.com/${{ github.repository }}/compare/develop...${{ steps.branch_info.outputs.branch_name }})
          
          ## ✅ Validações Realizadas
          
          - ✅ Setup do Node.js 20 concluído
          - ✅ Dependências instaladas com sucesso
          - ✅ Testes executados e aprovados
          - ✅ Build executado com sucesso
          - ✅ Aplicação inicializa corretamente
          
          EOF
          
          echo "📄 Arquivo de instruções criado: PR_INSTRUCTIONS.md"
      
      # Notificação se PR já existe
      - name: PR Already Exists Notification
        if: steps.check_pr.outputs.pr_exists == 'true'
        run: |
          echo "ℹ️ **Pull Request já existe**"
          echo ""
          echo "📋 **Detalhes da PR existente:**"
          echo "   - 🌿 Branch origem: ${{ steps.branch_info.outputs.branch_name }}"
          echo "   - 🎯 Branch destino: develop"
          echo "   - 🔢 Número: #${{ steps.check_pr.outputs.pr_number }}"
          echo "   - 🔗 URL: ${{ steps.check_pr.outputs.pr_url }}"
          echo ""
          echo "✅ **Nenhuma ação necessária - PR já existe e está ativa!**"
          echo ""
          echo "🎯 **Próximos passos:**"
          echo "   1. Revisar a PR existente"
          echo "   2. Adicionar reviewers se necessário"
          echo "   3. Aprovar e fazer merge quando estiver tudo OK"
