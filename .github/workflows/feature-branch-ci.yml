name: Feature Branch CI/CD

# Workflow será acionado apenas para branches com prefixo feature/*
on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - 'feature/*'

# Permissões necessárias para o workflow e seus sub-workflows
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      # Checkout do código
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Setup do Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Instalação das dependências
      - name: Install Dependencies
        run: npm install
      
      # Verificação de lint (se houver)
      - name: Run Lint Check
        run: |
          if npm run lint --if-present; then
            echo "✅ Lint check passed"
          else
            echo "ℹ️ No lint script found, skipping..."
          fi
      
      # Execução dos testes
      - name: Run Tests
        run: |
          echo "🧪 Running tests..."
          npm test
          echo "✅ All tests passed successfully!"
      
      # Execução do build
      - name: Run Build
        run: |
          echo "🔨 Running build..."
          npm run build
          echo "✅ Build completed successfully!"
      
      # Verificação se o aplicativo inicia corretamente
      - name: Verify Application Startup
        run: |
          echo "🚀 Verifying application startup..."
          timeout 10s npm start || true
          echo "✅ Application startup verified!"
  
  # Job para validar se tudo passou
  success-validation:
    name: Validation Success
    runs-on: ubuntu-latest
    needs: test-and-build
    if: success()
    
    steps:
      - name: All Checks Passed
        run: |
          echo "🎉 SUCCESS: All validation checks passed!"
          echo "✅ Tests completed successfully"
          echo "✅ Build completed successfully" 
          echo "✅ Application startup verified"
          echo ""
          echo "🚀 Feature branch is ready for review!"
  
  # Job para indicar falha
  failure-notification:
    name: Validation Failed
    runs-on: ubuntu-latest
    needs: test-and-build
    if: failure()
    
    steps:
      - name: Workflow Failed
        run: |
          echo "❌ FAILURE: One or more validation checks failed!"
          echo "🔍 Please check the logs above for details"
          echo "🛠️ Fix the issues and push again"
          exit 1

  # Job para criar PR automaticamente após sucesso
  create-pr:
    name: Auto Create PR
    needs: test-and-build
    if: success()
    uses: ./.github/workflows/create-pr-to-develop.yml
    with:
      source_branch: ${{ github.ref_name }}
      pr_title: "feat: Auto PR from ${{ github.ref_name }}"
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
