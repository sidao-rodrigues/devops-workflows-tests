name: Feature Branch CI

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - 'feature/*'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Removendo cache para evitar problemas com projetos simples
        
    - name: Verify Node.js installation
      run: |
        node --version
        npm --version
        
    - name: Install dependencies (if needed)
      run: |
        echo "Checking for dependencies..."
        if [ -f package-lock.json ]; then
          echo "Using package-lock.json"
          npm ci
        elif [ -f package.json ]; then
          echo "Using package.json"
          npm install
        else
          echo "No package.json found, skipping dependency installation"
        fi
        
    - name: Verify project version
      run: |
        echo "Checking project version..."
        node -p "require('./package.json').version"
        echo "Project version verified successfully!"
        
    - name: Run tests
      run: |
        echo "Starting test execution..."
        npm test
        echo "Tests execution completed!"
        
    - name: Run build
      run: |
        echo "Starting build process..."
        npm run build
        echo "Build process completed!"
        
    - name: Validate build artifacts
      run: |
        echo "Validating build artifacts..."
        ls -la
        echo "Build artifacts validation completed!"
        
    - name: Success notification
      if: success()
      run: |
        echo "✅ All checks passed for feature branch!"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Node.js version: ${{ matrix.node-version }}"
        
    - name: Failure notification
      if: failure()
      run: |
        echo "❌ Some checks failed for feature branch!"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Node.js version: ${{ matrix.node-version }}"