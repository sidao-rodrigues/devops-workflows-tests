name: General CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      continue-on-error: true
      
    - name: Run tests
      run: npm test
      
    - name: Run build
      run: npm run build
      
    - name: Project validation
      run: |
        echo "✅ Main/Develop branch validation completed!"
        echo "All checks passed successfully!"
